<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM: Список партнеров и скидок</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="resources/logo.svg" alt="Логотип компании">
    <h1 class="app-header__title">CRM: Список партнеров и скидок</h1>
  </header>

  <main class="partner-panel">
    <p class="partner-panel__status" id="partner-status" role="status">Загрузка...</p>
    <ul class="partner-list" id="partner-list"></ul>
  </main>

  <template id="partner-card-template">
    <li class="partner-card">
      <div class="partner-card__details">
        <h2 class="partner-card__name"></h2>
        <p class="partner-card__line" data-field="email"></p>
        <p class="partner-card__line" data-field="phone"></p>
        <p class="partner-card__line" data-field="rating"></p>
      </div>
      <p class="partner-card__discount"></p>
    </li>
  </template>
</body>
</html>
